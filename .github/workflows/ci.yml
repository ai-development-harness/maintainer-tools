name: Maintainer Tools CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compile helpers
        run: python -m py_compile scripts/release.py scripts/release_gates.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
