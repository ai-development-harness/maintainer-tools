name: Maintainer Tools CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compile helpers
        run: python -m py_compile scripts/release.py scripts/release_gates.py scripts/resolve_release_pr.py scripts/canary_promotion.py scripts/release_completion.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # Отдельный видимый шаг сохраняет regression отказа Prepare в каждом CI run.
      - name: Verify Prepare negative scenarios
        run: python -m unittest discover -s tests -p test_prepare_negative.py -v
