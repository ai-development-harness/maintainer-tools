name: Publish Harness Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, например v0.2.7"
        required: true
        type: string
      harness_branch:
        description: "Ветка Harness, в которую был влит release PR, например main или maint/0.1.x"
        required: true
        type: string
      title:
        description: "Название GitHub Release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: harness-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Пробелы из формы workflow_dispatch ломают имена ветки/PR/tag: нормализуем
      # inputs один раз и дальше используем только outputs этого шага.
      - name: Normalize inputs
        id: normalize
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version }}
          RAW_HARNESS_BRANCH: ${{ inputs.harness_branch }}
          RAW_TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$RAW_VERSION" | tr -d '[:space:]')"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like v1.2.3, got: '$RAW_VERSION'" >&2
            exit 1
          fi

          HARNESS_BRANCH="$(printf '%s' "$RAW_HARNESS_BRANCH" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "$HARNESS_BRANCH" ]]; then
            echo "Harness branch must be specified explicitly; there is no default branch." >&2
            exit 1
          fi
          if [[ "$HARNESS_BRANCH" == refs/* ]]; then
            echo "Use a short Harness branch name, not a refs/* name: '$HARNESS_BRANCH'" >&2
            exit 1
          fi
          if ! git check-ref-format --branch "$HARNESS_BRANCH" >/dev/null 2>&1; then
            echo "Invalid Harness branch name: '$HARNESS_BRANCH'" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "harness_branch=${HARNESS_BRANCH}" >> "$GITHUB_OUTPUT"
          TITLE="$(printf '%s' "$RAW_TITLE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$TITLE" ]; then
            echo "Release title must not be empty." >&2
            exit 1
          fi
          {
            echo "title<<__HARNESS_TITLE__"
            printf '%s\n' "$TITLE"
            echo "__HARNESS_TITLE__"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout maintainer tools
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Read release config
        id: config
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("config/release.json").read_text(encoding="utf-8"))
          owner, name = config["targetRepository"].split("/", 1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"target_repository={config['targetRepository']}", file=out)
              print(f"owner={owner}", file=out)
              print(f"repository_name={name}", file=out)
              print(f"branch_prefix={config['releaseBranchPrefix']}", file=out)
          PY

      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HARNESS_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HARNESS_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repository_name }}
          permission-contents: write
          permission-pull-requests: read

      - name: Checkout Harness source repository
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.config.outputs.target_repository }}
          ref: ${{ steps.normalize.outputs.harness_branch }}
          token: ${{ steps.app-token.outputs.token }}
          path: target
          fetch-depth: 0

      - name: Verify Harness source branch
        id: source
        shell: bash
        env:
          HARNESS_BRANCH: ${{ steps.normalize.outputs.harness_branch }}
        run: |
          set -euo pipefail

          REMOTE_SHA="$(git -C target ls-remote --exit-code --heads origin "refs/heads/${HARNESS_BRANCH}" | awk 'NR == 1 {print $1}')"
          if [[ -z "$REMOTE_SHA" ]]; then
            echo "Harness branch '$HARNESS_BRANCH' does not exist in target repository." >&2
            exit 1
          fi

          LOCAL_SHA="$(git -C target rev-parse HEAD)"
          if [[ "$LOCAL_SHA" != "$REMOTE_SHA" ]]; then
            echo "Checked out ${LOCAL_SHA}, but origin/${HARNESS_BRANCH} is ${REMOTE_SHA}." >&2
            exit 1
          fi

          echo "source_sha=${REMOTE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Resolve release PR
        id: release-pr
        shell: bash
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
          TARGET_REPOSITORY: ${{ steps.config.outputs.target_repository }}
          HARNESS_BRANCH: ${{ steps.normalize.outputs.harness_branch }}
          BRANCH_PREFIX: ${{ steps.config.outputs.branch_prefix }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          BRANCH="${BRANCH_PREFIX}${VERSION}"
          EXPECTED_TITLE="chore: подготовить release ${VERSION}"

          PR_JSON="$(gh pr list \
            --repo "$TARGET_REPOSITORY" \
            --state all \
            --base "$HARNESS_BRANCH" \
            --head "$BRANCH" \
            --limit 10 \
            --json number,title,url,state,mergeCommit,mergedAt)"

          MERGE_SHA="$(PR_JSON="$PR_JSON" EXPECTED_TITLE="$EXPECTED_TITLE" python - <<'PY'
          import json
          import os
          import sys

          prs = json.loads(os.environ["PR_JSON"])
          expected = os.environ["EXPECTED_TITLE"]
          matches = [pr for pr in prs if pr.get("title") == expected]

          if len(matches) != 1:
              print(
                  f"expected exactly one release PR titled {expected!r}, got {len(matches)}",
                  file=sys.stderr,
              )
              raise SystemExit(2)

          pr = matches[0]
          merge_sha = (pr.get("mergeCommit") or {}).get("oid")
          if not pr.get("mergedAt") or not merge_sha:
              print(
                  f"release PR #{pr.get('number')} is not merged yet: {pr.get('url')}\n"
                  "Review it, use Squash and merge, then run Publish Harness Release again.",
                  file=sys.stderr,
              )
              raise SystemExit(2)

          print(merge_sha)
          PY
          )"

          git -C target fetch --no-tags origin "+refs/heads/${HARNESS_BRANCH}:refs/remotes/origin/${HARNESS_BRANCH}"
          if ! git -C target merge-base --is-ancestor "$MERGE_SHA" "refs/remotes/origin/${HARNESS_BRANCH}"; then
            echo "Release PR merge commit ${MERGE_SHA} is not reachable from Harness branch '${HARNESS_BRANCH}'." >&2
            echo "Refusing to publish a release whose selected source branch no longer contains the prepared release." >&2
            exit 1
          fi

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "merge_sha=${MERGE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release commit
        shell: bash
        env:
          MERGE_SHA: ${{ steps.release-pr.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git -C target checkout --detach "$MERGE_SHA"

      - name: Resolve Harness release layout
        id: layout
        shell: bash
        run: |
          set -euo pipefail
          LAYOUT_JSON="$(python scripts/release.py --config config/release.json layout --repo-dir target)"
          LAYOUT_JSON="$LAYOUT_JSON" python - <<'PY'
          import json
          import os

          layout = json.loads(os.environ["LAYOUT_JSON"])
          mapping = {
              "name": "name",
              "validator_path": "validatorPath",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for output, key in mapping.items():
                  print(f"{output}={layout[key]}", file=out)
          PY

      - name: Verify release metadata
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
        run: |
          python scripts/release.py \
            --config config/release.json \
            verify \
            --repo-dir target \
            --version "$VERSION"

      - name: Run Harness Integrity validator
        working-directory: target
        run: python3 "${{ steps.layout.outputs.validator_path }}" --mode ci

      - name: Create or verify release tag
        shell: bash
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
          MERGE_SHA: ${{ steps.release-pr.outputs.merge_sha }}
        run: |
          set -euo pipefail

          REMOTE_SHA="$(git -C target ls-remote origin "refs/tags/${VERSION}" | awk '{print $1}')"
          if [[ -n "$REMOTE_SHA" ]]; then
            if [[ "$REMOTE_SHA" != "$MERGE_SHA" ]]; then
              echo "Tag ${VERSION} already exists on ${REMOTE_SHA}, expected ${MERGE_SHA}." >&2
              exit 1
            fi
            echo "Tag ${VERSION} already points to the expected release commit."
          else
            git -C target tag "$VERSION" "$MERGE_SHA"
            git -C target push origin "refs/tags/${VERSION}"
          fi

      - name: Create or verify GitHub Release
        shell: bash
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
          TITLE: ${{ steps.normalize.outputs.title }}
          TARGET_REPOSITORY: ${{ steps.config.outputs.target_repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" --repo "$TARGET_REPOSITORY" --json name,isDraft,isPrerelease >/tmp/release.json 2>/dev/null; then
            EXISTING_TITLE="$(python -c 'import json; print(json.load(open("/tmp/release.json"))["name"])')"
            if [[ "$EXISTING_TITLE" != "$TITLE" ]]; then
              echo "Release ${VERSION} already exists with title '${EXISTING_TITLE}', expected '${TITLE}'." >&2
              exit 1
            fi
            echo "Release ${VERSION} already exists with the expected title. Nothing to do."
            exit 0
          fi

          gh release create "$VERSION" \
            --repo "$TARGET_REPOSITORY" \
            --title "$TITLE" \
            --generate-notes \
            --verify-tag \
            --latest
