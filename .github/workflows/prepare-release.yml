name: Prepare Harness Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Новый release tag, например v0.2.7"
        required: true
        type: string
      harness_branch:
        description: "Ветка Harness, из которой готовится релиз, например main или maint/0.1.x"
        required: true
        type: string
      reload_required:
        description: "Нужен ли новый запуск updater/runtime после применения перехода"
        required: true
        default: false
        type: boolean
      transition_kind:
        description: "Тип перехода update graph"
        required: true
        default: standard
        type: choice
        options:
          - standard
          - bridge
      transition_reason:
        description: "Причина bridge transition; для standard оставить пустым"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: harness-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      # Пробелы из формы workflow_dispatch ломают имена ветки/PR/tag: нормализуем
      # inputs один раз и дальше используем только outputs этого шага.
      - name: Normalize inputs
        id: normalize
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version }}
          RAW_HARNESS_BRANCH: ${{ inputs.harness_branch }}
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$RAW_VERSION" | tr -d '[:space:]')"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like v1.2.3, got: '$RAW_VERSION'" >&2
            exit 1
          fi

          HARNESS_BRANCH="$(printf '%s' "$RAW_HARNESS_BRANCH" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "$HARNESS_BRANCH" ]]; then
            echo "Harness branch must be specified explicitly; there is no default branch." >&2
            exit 1
          fi
          if [[ "$HARNESS_BRANCH" == refs/* ]]; then
            echo "Use a short Harness branch name, not a refs/* name: '$HARNESS_BRANCH'" >&2
            exit 1
          fi
          if ! git check-ref-format --branch "$HARNESS_BRANCH" >/dev/null 2>&1; then
            echo "Invalid Harness branch name: '$HARNESS_BRANCH'" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "harness_branch=${HARNESS_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Checkout maintainer tools
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Read release config
        id: config
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("config/release.json").read_text(encoding="utf-8"))
          owner, name = config["targetRepository"].split("/", 1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"target_repository={config['targetRepository']}", file=out)
              print(f"owner={owner}", file=out)
              print(f"repository_name={name}", file=out)
              print(f"branch_prefix={config['releaseBranchPrefix']}", file=out)
          PY

      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HARNESS_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HARNESS_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repository_name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout Harness source repository
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.config.outputs.target_repository }}
          ref: ${{ steps.normalize.outputs.harness_branch }}
          token: ${{ steps.app-token.outputs.token }}
          path: target
          fetch-depth: 0

      - name: Verify Harness source branch
        id: source
        shell: bash
        env:
          HARNESS_BRANCH: ${{ steps.normalize.outputs.harness_branch }}
        run: |
          set -euo pipefail

          REMOTE_SHA="$(git -C target ls-remote --exit-code --heads origin "refs/heads/${HARNESS_BRANCH}" | awk 'NR == 1 {print $1}')"
          if [[ -z "$REMOTE_SHA" ]]; then
            echo "Harness branch '$HARNESS_BRANCH' does not exist in target repository." >&2
            exit 1
          fi

          LOCAL_SHA="$(git -C target rev-parse HEAD)"
          if [[ "$LOCAL_SHA" != "$REMOTE_SHA" ]]; then
            echo "Checked out ${LOCAL_SHA}, but origin/${HARNESS_BRANCH} is ${REMOTE_SHA}." >&2
            exit 1
          fi

          echo "source_sha=${REMOTE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Resolve Harness release layout
        id: layout
        shell: bash
        run: |
          set -euo pipefail
          LAYOUT_JSON="$(python scripts/release.py --config config/release.json layout --repo-dir target)"
          LAYOUT_JSON="$LAYOUT_JSON" python - <<'PY'
          import json
          import os

          layout = json.loads(os.environ["LAYOUT_JSON"])
          mapping = {
              "name": "name",
              "manifest_path": "manifestPath",
              "lock_path": "lockPath",
              "graph_path": "updateGraphPath",
              "validator_path": "validatorPath",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for output, key in mapping.items():
                  print(f"{output}={layout[key]}", file=out)
          PY

      - name: Preflight
        id: preflight
        shell: bash
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
          TARGET_REPOSITORY: ${{ steps.config.outputs.target_repository }}
          BRANCH_PREFIX: ${{ steps.config.outputs.branch_prefix }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          CURRENT="$(python scripts/release.py --config config/release.json current --repo-dir target)"
          BRANCH="${BRANCH_PREFIX}${VERSION}"

          if git -C target ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Release tag ${VERSION} already exists." >&2
            exit 1
          fi

          if gh release view "${VERSION}" --repo "${TARGET_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${VERSION} already exists." >&2
            exit 1
          fi

          if git -C target ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Release branch ${BRANCH} already exists." >&2
            exit 1
          fi

          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Prepare metadata
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
          RELOAD_REQUIRED: ${{ inputs.reload_required }}
          TRANSITION_KIND: ${{ inputs.transition_kind }}
          TRANSITION_REASON: ${{ inputs.transition_reason }}
        run: |
          set -euo pipefail

          EXTRA_ARGS=(--transition-kind "$TRANSITION_KIND")
          if [[ "$RELOAD_REQUIRED" == "true" ]]; then
            EXTRA_ARGS+=(--reload-required)
          fi
          if [[ -n "$TRANSITION_REASON" ]]; then
            EXTRA_ARGS+=(--transition-reason "$TRANSITION_REASON")
          fi

          python scripts/release.py \
            --config config/release.json \
            prepare \
            --repo-dir target \
            --version "$VERSION" \
            "${EXTRA_ARGS[@]}"

      - name: Verify prepared metadata
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
        run: |
          python scripts/release.py \
            --config config/release.json \
            verify \
            --repo-dir target \
            --version "$VERSION"

      - name: Run Harness Integrity validator
        working-directory: target
        run: python3 "${{ steps.layout.outputs.validator_path }}" --mode ci

      - name: Commit and push release branch
        shell: bash
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
          BRANCH: ${{ steps.preflight.outputs.branch }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MANIFEST_PATH: ${{ steps.layout.outputs.manifest_path }}
          LOCK_PATH: ${{ steps.layout.outputs.lock_path }}
          GRAPH_PATH: ${{ steps.layout.outputs.graph_path }}
          HARNESS_BRANCH: ${{ steps.normalize.outputs.harness_branch }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail

          REMOTE_SOURCE_SHA="$(git -C target ls-remote --exit-code --heads origin "refs/heads/${HARNESS_BRANCH}" | awk 'NR == 1 {print $1}')"
          if [[ "$REMOTE_SOURCE_SHA" != "$SOURCE_SHA" ]]; then
            echo "Harness source branch moved during release preparation: ${SOURCE_SHA} -> ${REMOTE_SOURCE_SHA}. Rerun the workflow." >&2
            exit 1
          fi

          BOT_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git -C target config user.name "${APP_SLUG}[bot]"
          git -C target config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          git -C target switch -c "$BRANCH"
          git -C target add -- "$MANIFEST_PATH" "$LOCK_PATH" "$GRAPH_PATH"

          if git -C target diff --cached --quiet; then
            echo "Release preparation produced no metadata diff." >&2
            exit 1
          fi

          git -C target commit -m "chore: подготовить release ${VERSION}"
          git -C target push origin "HEAD:refs/heads/${BRANCH}"

      - name: Create release pull request
        shell: bash
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
          CURRENT: ${{ steps.preflight.outputs.current }}
          BRANCH: ${{ steps.preflight.outputs.branch }}
          LAYOUT: ${{ steps.layout.outputs.name }}
          TARGET_REPOSITORY: ${{ steps.config.outputs.target_repository }}
          HARNESS_BRANCH: ${{ steps.normalize.outputs.harness_branch }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          cat > /tmp/release-pr.md <<EOF
          ## Release preparation

          Автоматически подготовлены machine-readable metadata для Harness ${VERSION}.

          - source Harness branch: \`${HARNESS_BRANCH}\`;
          - source branch SHA at preparation start: \`${SOURCE_SHA}\`;
          - current canonical release: \`${CURRENT}\`;
          - target release: \`${VERSION}\`;
          - release layout: \`${LAYOUT}\`;
          - manifest, lock и update graph синхронизированы;
          - transition \`${CURRENT} → ${VERSION}\`: \`reloadRequired=${{ inputs.reload_required }}\`;
          - Harness Integrity validator пройден до создания PR;
          - tag/release **не создаются** этим workflow.

          После review и squash merge этого PR запусти workflow **Publish Harness Release** с тем же version.
          EOF

          gh pr create \
            --repo "$TARGET_REPOSITORY" \
            --base "$HARNESS_BRANCH" \
            --head "$BRANCH" \
            --title "chore: подготовить release ${VERSION}" \
            --body-file /tmp/release-pr.md
